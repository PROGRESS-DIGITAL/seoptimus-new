# Вариант с уже существующей PostgreSQL (например, managed-БД Timeweb).
# Контейнер db не запускается, адрес берётся из DATABASE_URL в .env.
# Запуск: docker compose -f docker-compose.yml -f deploy/compose.external-db.yml up -d --build
services:
  db:
    profiles: ["local-db"]
  migrate:
    depends_on: !reset {}
